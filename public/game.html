<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUGO SWP</title>
  <link rel="icon" href="images/hugo-logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="game-page">
    <header class="topbar">
      <span>Angemeldet als <strong id="current-username">…</strong></span>
      <button id="logout-btn" class="link-btn">Abmelden</button>
    </header>

    <img class="logo logo-game" src="images/hugo-logo.png" alt="HUGO SWP – Schere, Stein, Papier" />

    <section class="stats">
      <div><span id="stat-wins">0</span><small>Siege</small></div>
      <div><span id="stat-draws">0</span><small>Unentschieden</small></div>
      <div><span id="stat-losses">0</span><small>Niederlagen</small></div>
    </section>

    <section id="mode-select" class="mode-select">
      <button id="mode-bot-btn" class="mode-btn">🤖<br />Gegen Bot spielen</button>
      <button id="mode-multiplayer-btn" class="mode-btn">🧑‍🤝‍🧑<br />Gegen Spieler spielen</button>
    </section>

    <section id="waiting-panel" class="waiting-panel hidden">
      <p>Suche Gegner…</p>
      <div class="spinner"></div>
      <button id="cancel-queue-btn" class="link-btn">Abbrechen</button>
    </section>

    <section id="game-section" class="hidden">
      <p id="opponent-status" class="opponent-status"></p>

      <section class="arena">
        <div class="player">
          <p class="label">Du</p>
          <div id="player-hand" class="hand">❔</div>
        </div>

        <div id="center-display" class="center">VS</div>

        <div class="player">
          <p id="opponent-label" class="label">Bot</p>
          <div id="computer-hand" class="hand">❔</div>
        </div>
      </section>

      <p id="result-text" class="result"></p>

      <section class="choices">
        <button class="choice-btn" data-choice="stein">🪨<br />Stein</button>
        <button class="choice-btn" data-choice="papier">📄<br />Papier</button>
        <button class="choice-btn" data-choice="schere">✂️<br />Schere</button>
      </section>

      <div class="post-round-actions">
        <button id="rematch-btn" class="link-btn hidden">Nächste Runde suchen</button>
        <button id="back-to-menu-btn" class="link-btn">← Zurück zum Menü</button>
      </div>
    </section>
  </main>

  <script src="js/game.js"></script>
</body>
</html>
