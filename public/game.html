<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AXXIN SSP</title>
  <link rel="icon" href="images/Axxin-SSP.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="game-page">
    <header class="topbar">
      <span>Angemeldet als <strong id="current-username">…</strong> <span id="role-badge" class="role-badge hidden"></span></span>
      <button id="logout-btn" class="link-btn">Abmelden</button>
    </header>

    <img class="logo logo-game" src="images/Axxin-SSP.png" alt="AXXIN SSP – Schere, Stein, Papier" />

    <section class="stats">
      <div><span id="stat-wins">0</span><small>Siege</small></div>
      <div><span id="stat-draws">0</span><small>Unentschieden</small></div>
      <div><span id="stat-losses">0</span><small>Niederlagen</small></div>
    </section>

    <section id="mode-select" class="mode-select">
      <button id="mode-bot-btn" class="mode-btn">🤖<br />Gegen Bot spielen</button>
      <button id="mode-join-code-btn" class="mode-btn">🔑<br />Mit Code beitreten</button>
      <button id="mode-host-btn" class="mode-btn admin-btn hidden">🎙️<br />Spiel hosten (Admin)</button>
      <button id="mode-tournament-btn" class="mode-btn admin-btn hidden">🏆<br />Turnier starten (Admin)</button>
    </section>

    <section id="game-section" class="hidden">
      <section class="arena">
        <div class="player">
          <p class="label">Du</p>
          <div id="player-hand" class="hand">❔</div>
        </div>

        <div id="center-display" class="center">VS</div>

        <div class="player">
          <p class="label">Bot</p>
          <div id="computer-hand" class="hand">❔</div>
        </div>
      </section>

      <p id="result-text" class="result"></p>

      <section class="choices">
        <button class="choice-btn" data-choice="stein">🪨<br />Stein</button>
        <button class="choice-btn" data-choice="papier">📄<br />Papier</button>
        <button class="choice-btn" data-choice="schere">✂️<br />Schere</button>
      </section>

      <div class="post-round-actions">
        <button id="back-to-menu-btn" class="link-btn">← Zurück zum Menü</button>
      </div>
    </section>

    <section id="join-code-panel" class="form-panel hidden">
      <h2>Mit Code beitreten</h2>
      <label for="join-code-input">Spielcode</label>
      <input type="text" id="join-code-input" maxlength="6" placeholder="z.B. AB3XZ9" autocomplete="off" />
      <button id="join-code-btn" type="button">Beitreten</button>
      <p id="join-code-message" class="message"></p>
      <button id="join-code-back-btn" class="link-btn">← Zurück zum Menü</button>
    </section>

    <section id="host-setup-panel" class="form-panel hidden">
      <h2>Spiel hosten</h2>

      <label for="host-target-score">Punkte zum Sieg</label>
      <input type="number" id="host-target-score" min="1" max="50" value="3" />

      <label>Einsatz</label>
      <div class="stake-type-tabs">
        <button type="button" class="stake-type-btn active" data-stake-type="money">💶 Geld</button>
        <button type="button" class="stake-type-btn" data-stake-type="item">⛏️ Minecraft-Item</button>
      </div>

      <div id="stake-money-fields" class="stake-fields">
        <label for="stake-amount">Betrag (€)</label>
        <input type="number" id="stake-amount" min="0.01" step="0.01" placeholder="z.B. 5" />
      </div>

      <div id="stake-item-fields" class="stake-fields hidden">
        <label for="item-search">Minecraft-Item suchen</label>
        <input type="text" id="item-search" placeholder="z.B. Diamantschwert" autocomplete="off" />
        <div id="item-search-results" class="item-search-results hidden"></div>

        <div id="selected-item-display" class="selected-item-display hidden">
          <span id="selected-item-name"></span>
          <button type="button" id="clear-selected-item-btn" class="link-btn">Ändern</button>
        </div>

        <label for="stake-custom-label">Eigene Bezeichnung (optional)</label>
        <input type="text" id="stake-custom-label" placeholder="z.B. mit Schärfe V" maxlength="80" />

        <label for="stake-quantity">Menge</label>
        <input type="number" id="stake-quantity" min="1" value="1" />
      </div>

      <button id="create-host-match-btn" type="button">Spiel erstellen</button>
      <p id="host-setup-message" class="message"></p>
      <button id="host-setup-back-btn" class="link-btn">← Zurück zum Menü</button>
    </section>

    <section id="hosted-match-section" class="hidden">
      <div id="hosted-code-banner" class="hosted-code-banner hidden">
        <span>Code: <strong id="hosted-code-display"></strong></span>
        <button id="copy-join-link-btn" type="button" class="link-btn">Link kopieren</button>
      </div>

      <div id="hosted-pending-panel" class="hosted-pending-panel hidden">
        <h3>Beitrittsanfragen</h3>
        <input type="text" id="pending-search" placeholder="Name suchen…" autocomplete="off" />
        <div id="pending-list" class="pending-list"></div>
      </div>

      <div id="hosted-stake-banner" class="stake-banner"></div>

      <div id="hosted-score-bar" class="score-bar"></div>

      <p id="hosted-status-text" class="opponent-status"></p>

      <section class="arena">
        <div class="player">
          <p id="hosted-label-a" class="label">?</p>
          <div id="hosted-hand-a" class="hand">❔</div>
        </div>

        <div id="hosted-center-display" class="center">VS</div>

        <div class="player">
          <p id="hosted-label-b" class="label">?</p>
          <div id="hosted-hand-b" class="hand">❔</div>
        </div>
      </section>

      <p id="hosted-result-text" class="result"></p>

      <section id="hosted-choices" class="choices hidden">
        <button class="hosted-choice-btn" data-choice="stein">🪨<br />Stein</button>
        <button class="hosted-choice-btn" data-choice="papier">📄<br />Papier</button>
        <button class="hosted-choice-btn" data-choice="schere">✂️<br />Schere</button>
      </section>

      <div class="post-round-actions">
        <button id="hosted-close-btn" class="link-btn hidden">Match schließen</button>
        <button id="hosted-back-btn" class="link-btn">← Zurück zum Menü</button>
      </div>
    </section>

    <section id="tournament-setup-panel" class="form-panel hidden">
      <h2>Turnier erstellen</h2>

      <label for="tournament-target-score">Punkte zum Sieg pro Match</label>
      <input type="number" id="tournament-target-score" min="1" max="50" value="1" />

      <div id="tournament-prizes-container"></div>

      <button id="create-tournament-btn" type="button">Turnier erstellen</button>
      <p id="tournament-setup-message" class="message"></p>
      <button id="tournament-setup-back-btn" class="link-btn">← Zurück zum Menü</button>
    </section>

    <section id="tournament-section" class="hidden">
      <div id="tournament-code-banner" class="hosted-code-banner hidden">
        <span>Code: <strong id="tournament-code-display"></strong></span>
        <button id="tournament-copy-link-btn" type="button" class="link-btn">Link kopieren</button>
      </div>

      <div id="tournament-pending-panel" class="hosted-pending-panel hidden">
        <h3>Beitrittsanfragen</h3>
        <input type="text" id="tournament-pending-search" placeholder="Name suchen…" autocomplete="off" />
        <div id="tournament-pending-list" class="pending-list"></div>
      </div>

      <div id="tournament-prizes-banner" class="stake-banner"></div>

      <div id="tournament-roster-panel" class="tournament-roster-panel hidden">
        <h3>Teilnehmer <span id="tournament-roster-count"></span></h3>
        <div id="tournament-roster-list" class="tournament-roster-list"></div>
        <button id="start-tournament-btn" type="button" class="hidden">Turnier starten</button>
      </div>

      <p id="tournament-status-text" class="opponent-status"></p>

      <div id="tournament-my-matchup" class="hidden">
        <p class="label">Dein Match</p>
        <div class="score-bar" id="tournament-my-score-bar"></div>
        <section class="arena">
          <div class="player">
            <p id="tournament-label-a" class="label">?</p>
            <div id="tournament-hand-a" class="hand">❔</div>
          </div>

          <div id="tournament-center-display" class="center">VS</div>

          <div class="player">
            <p id="tournament-label-b" class="label">?</p>
            <div id="tournament-hand-b" class="hand">❔</div>
          </div>
        </section>

        <p id="tournament-result-text" class="result"></p>

        <section id="tournament-choices" class="choices hidden">
          <button class="tournament-choice-btn" data-choice="stein">🪨<br />Stein</button>
          <button class="tournament-choice-btn" data-choice="papier">📄<br />Papier</button>
          <button class="tournament-choice-btn" data-choice="schere">✂️<br />Schere</button>
        </section>
      </div>

      <div id="tournament-bracket" class="tournament-bracket"></div>

      <div id="tournament-standings" class="tournament-standings hidden"></div>

      <div class="post-round-actions">
        <button id="tournament-close-btn" class="link-btn hidden">Turnier abbrechen</button>
        <button id="tournament-back-btn" class="link-btn">← Zurück zum Menü</button>
      </div>
    </section>
  </main>

  <script src="js/game.js"></script>
</body>
</html>
