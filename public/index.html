<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUGO SWP</title>
  <link rel="icon" href="images/hugo-logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="auth-page">
    <div class="card">
      <img class="logo" src="images/hugo-logo.png" alt="HUGO SWP – Schere, Stein, Papier" />

      <div class="tabs">
        <button class="tab-btn active" data-tab="join">Mit Code beitreten</button>
        <button class="tab-btn" data-tab="login">Admin-Login</button>
      </div>

      <form id="join-form" class="tab-panel active">
        <label for="join-name">Dein Name</label>
        <input type="text" id="join-name" maxlength="24" autocomplete="off" required />

        <label for="join-code">Spielcode</label>
        <input type="text" id="join-code" maxlength="6" placeholder="z.B. AB3XZ9" autocomplete="off" required />

        <button type="submit">Beitreten</button>
      </form>

      <form id="login-form" class="tab-panel">
        <label for="login-username">Benutzername</label>
        <input type="text" id="login-username" autocomplete="username" required />

        <label for="login-password">Passwort</label>
        <input type="password" id="login-password" autocomplete="current-password" required />

        <button type="submit">Anmelden</button>
      </form>

      <p id="auth-message" class="message"></p>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
